<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2Junior's — Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700;1,900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:'DM Sans',system-ui,sans-serif;
      background:oklch(0.09 0.005 260);
      color:oklch(0.95 0 0);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;
      padding:1rem;
    }
    .login-wrap{
      width:min(380px,100%);
      background:oklch(0.12 0.005 260);
      border:1px solid oklch(0.22 0.005 260);
      border-radius:1rem;
      padding:2.5rem 2rem;
      display:flex;flex-direction:column;gap:1.5rem;
      animation:fadeUp .4s ease-out both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(1rem)}to{opacity:1;transform:translateY(0)}}
    .logo-block{text-align:center}
    .logo{
      font-family:'Playfair Display','Times New Roman',serif;
      font-weight:700;font-style:italic;
      font-size:2.25rem;color:#fff;letter-spacing:.5px;
      display:block;
    }
    .subtitle{font-size:.875rem;color:oklch(0.55 0 0);margin-top:.375rem}
    .divider{height:1px;background:oklch(0.22 0.005 260)}
    .field{display:flex;flex-direction:column;gap:.375rem}
    .field label{font-size:.75rem;font-weight:500;color:oklch(0.65 0 0);text-transform:uppercase;letter-spacing:.05em}
    .field input{
      height:2.75rem;padding:0 .875rem;
      border-radius:.5rem;
      background:oklch(0.16 0.005 260);
      border:1px solid oklch(0.22 0.005 260);
      color:oklch(0.95 0 0);
      font-family:inherit;font-size:.9375rem;
      outline:none;
      transition:border-color .2s,background .2s;
    }
    .field input:focus{border-color:oklch(0.7 0.18 145);background:oklch(0.18 0.005 260)}
    .field input::placeholder{color:oklch(0.38 0 0)}
    .error-msg{
      padding:.625rem .875rem;border-radius:.5rem;
      background:color-mix(in oklch,oklch(0.65 0.2 25) 12%,transparent);
      border:1px solid color-mix(in oklch,oklch(0.65 0.2 25) 30%,transparent);
      color:oklch(0.75 0.18 25);
      font-size:.875rem;
      display:none;
    }
    .error-msg.show{display:block}
    .btn-submit{
      height:2.75rem;border:none;border-radius:.5rem;
      background:oklch(0.7 0.18 145);
      color:oklch(0.09 0.005 260);
      font-family:inherit;font-size:.9375rem;font-weight:600;
      cursor:pointer;
      transition:opacity .15s,transform .1s;
      display:flex;align-items:center;justify-content:center;gap:.5rem;
    }
    .btn-submit:hover{opacity:.88}
    .btn-submit:active{transform:scale(.98)}
    .btn-submit:disabled{opacity:.5;cursor:default}
    .spinner{width:1rem;height:1rem;border:2px solid transparent;border-top-color:currentColor;border-radius:50%;animation:spin .7s linear infinite;display:none}
    .btn-submit.loading .spinner{display:block}
    .btn-submit.loading .btn-lbl{opacity:.7}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo-block">
      <span class="logo">2Junior's</span>
      <p class="subtitle">Inteligência de Mídia</p>
    </div>
    <div class="divider"></div>
    <form id="login-form" autocomplete="on">
      <div style="display:flex;flex-direction:column;gap:1rem">
        <div class="field">
          <label>Email ou usuário</label>
          <input type="text" id="email" name="email" placeholder="admin@2juniors.com" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div class="error-msg" id="error-msg"></div>
        <button type="submit" class="btn-submit" id="submit-btn">
          <span class="spinner" id="spinner"></span>
          <span class="btn-lbl">Entrar</span>
        </button>
      </div>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      errEl.className = 'error-msg';
      btn.disabled = true;
      btn.classList.add('loading');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (res.ok) {
          const isMobile = window.matchMedia('(max-width: 768px)').matches ||
            /Mobile|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
          window.location.href = isMobile ? '/mobile' : '/dashboard.html';
        } else {
          errEl.textContent = data.error || 'Credenciais inválidas';
          errEl.classList.add('show');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        errEl.textContent = 'Erro de conexão. Tente novamente.';
        errEl.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
